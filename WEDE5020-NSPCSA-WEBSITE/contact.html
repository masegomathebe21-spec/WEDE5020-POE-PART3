
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NSPCA | Contact Us</title>

    <meta name="description" content="Find NSPCA contact information and send a message about animal welfare, animal cruelty or general enquiries.">

    <meta name="keywords" content="NSPCA contact, animal cruelty report, animal welfare, NSPCA South Africa">

    <meta name="author" content="National Council of SPCAs">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>National Council of SPCAs (NSPCA)</h1>
        <p>Protecting Animals, Preventing Cruelty</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <section class="content-section">
            <h2>Find Us</h2>

            <p>
                Visit the NSPCA Head Office in Alberton, Gauteng.
            </p>

            <iframe
                src="https://www.google.com/maps?q=NSPCA+6+Clark+Street+Florentia+Alberton+Gauteng&output=embed"
                width="100%"
                height="350"
                style="border:0;"
                allowfullscreen
                loading="lazy"
                title="Google Maps showing the NSPCA Head Office">
            </iframe>
        </section>

        <section class="content-section">

            <h2>Contact Us</h2>

            <p>Have a question or need assistance? Send us a message.</p>

            <form id="contactForm">

                <label for="contactName">Full Name:</label>
                <input type="text" id="contactName" name="contactName"
                       required minlength="3">

                <label for="contactEmail">Email Address:</label>
                <input type="email" id="contactEmail" name="contactEmail"
                       required>

                <label for="contactPhone">Phone Number:</label>
                <input type="tel" id="contactPhone" name="contactPhone"
                       pattern="[0-9]{10}" placeholder="0123456789"
                       required>

                <label for="messageType">Message Type:</label>
                <select id="messageType" name="messageType" required>
                    <option value="">Select message type</option>
                    <option value="General Enquiry">General Enquiry</option>
                    <option value="Animal Welfare">Animal Welfare</option>
                    <option value="Donation">Donation</option>
                    <option value="Volunteering">Volunteering</option>
                    <option value="Other">Other</option>
                </select>

                <label for="contactMessage">Your Message:</label>
                <textarea id="contactMessage" name="contactMessage"
                          rows="6" required minlength="10"></textarea>

                <button type="submit">Send Message</button>

            </form>

            <div id="contactResponse" aria-live="polite"></div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 National Council of SPCAs. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
